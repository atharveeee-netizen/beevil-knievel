            <rect x="0" y="0" width="454" height="48" rx="6" fill="#0f172a" stroke="#1e293b"/>
            <circle cx="20" cy="24" r="10" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981"/>
            <text x="20" y="28" class="badge" fill="#10b981" text-anchor="middle">A</text>
