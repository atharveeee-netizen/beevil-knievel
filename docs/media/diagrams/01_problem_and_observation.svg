        <rect width="490" height="350" rx="10" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.8"/>
        <rect x="18" y="16" width="210" height="22" rx="4" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1"/>
