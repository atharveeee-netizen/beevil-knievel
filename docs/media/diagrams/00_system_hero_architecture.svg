            <stop offset="0%" stop-color="#111a2d"/>
            <stop offset="100%" stop-color="#0c1220"/>
        </linearGradient>
        <linearGradient id="cardGradHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1a253c"/>
            <stop offset="100%" stop-color="#0f182b"/>
