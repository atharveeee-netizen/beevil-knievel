server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name beevil.local _;

    # Static Next.js / React Dashboard Frontend
    location / {
        root /home/pi/beevil-knievel/frontend/out;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # REST API Reverse Proxy to FastAPI Backend
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket Real-Time Stream
    location /api/v1/ws/ {
        proxy_pass http://127.0.0.1:8000/api/v1/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Captive Portal detection redirects (Apple, Android, Windows)
    location /hotspot-detect.html {
        return 302 http://beevil.local/;
    }
    location /generate_204 {
        return 302 http://beevil.local/;
    }
    location /ncsi.txt {
        return 302 http://beevil.local/;
    }
}
